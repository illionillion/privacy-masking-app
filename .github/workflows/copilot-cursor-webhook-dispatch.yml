# Copilot review → Cursor gate 完了後、secrets を使って Webhook を POST する。
#
# workflow_run 起点のため Copilot bot actor による Approve Run を避けられる。
# gate workflow が success かつ artifact がある場合のみ実行する。

name: Copilot review → Cursor Automation webhook

on:
  workflow_run:
    workflows: ["Copilot review → Cursor gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: copilot-cursor-webhook-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  trigger-cursor-automation:
    name: Trigger Cursor Automation webhook
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'check_run'
    steps:
      - name: Download webhook payload artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cursor-webhook-payload
          path: /tmp/cursor-webhook
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: POST Cursor Automation webhook
        if: steps.download.outcome == 'success'
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
          WEBHOOK_API_KEY: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail

          if [ ! -f /tmp/cursor-webhook/payload.json ]; then
            echo "No webhook payload artifact. Gate likely skipped (0 inline comments)."
            exit 0
          fi

          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_API_KEY}" ]; then
            echo "::warning::Secrets CURSOR_AUTOMATION_WEBHOOK_URL and CURSOR_AUTOMATION_WEBHOOK_API_KEY are not set. Skipping Cursor Automation webhook."
            exit 0
          fi

          payload=$(cat /tmp/cursor-webhook/payload.json)
          pull_request_number=$(jq -r '.pull_request_number' /tmp/cursor-webhook/payload.json)
          review_id=$(jq -r '.review_id' /tmp/cursor-webhook/payload.json)
          new_comment_count=$(jq -r '.new_comment_count' /tmp/cursor-webhook/payload.json)

          echo "Triggering Cursor Automation for PR #${pull_request_number} (review ${review_id}, ${new_comment_count} new comment(s))"

          http_status=$(curl --silent --show-error --output /tmp/cursor-webhook-response.txt \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${WEBHOOK_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${WEBHOOK_URL}")

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "Cursor webhook response (${http_status}):"
            cat /tmp/cursor-webhook-response.txt
            echo "::error::Cursor webhook failed with HTTP ${http_status}"
            exit 1
          fi

          echo "Cursor webhook response (${http_status}):"
          cat /tmp/cursor-webhook-response.txt

      - name: Skip webhook (no payload artifact)
        if: steps.download.outcome != 'success'
        run: |
          echo "No cursor-webhook-payload artifact on gate run ${{ github.event.workflow_run.id }}. Skipping webhook."
