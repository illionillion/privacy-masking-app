# Copilot コードレビュー完了後、Webhook 起動用の payload を artifact に書き出す（secrets 不使用）。
#
# pull_request_review は Copilot bot 起点で Approve Run が必要になる。
# check_run も Copilot（dynamic workflow）完了では発火しないことがある。
# そのため Copilot workflow（workflow 名: Copilot）の workflow_run 完了をトリガーにする。
# secrets を使う Webhook POST は copilot-cursor-webhook-dispatch.yml（workflow_run）に委譲する。
#
# 新規インラインコメントが 0 件の Copilot review では artifact を作らない。

name: Copilot review → Cursor gate

on:
  workflow_run:
    workflows: ["Copilot"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: copilot-cursor-gate-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  prepare-cursor-webhook:
    name: Prepare Cursor Automation payload
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'dynamic' &&
      github.event.workflow_run.pull_requests[0] != null
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve Copilot review and count inline comments
        id: review-comments
        uses: actions/github-script@v7
        with:
          script: |
            const COPILOT_LOGINS = new Set([
              'Copilot',
              'copilot-pull-request-reviewer',
              'copilot-pull-request-reviewer[bot]',
            ]);

            const workflowRun = context.payload.workflow_run;
            const pullNumber = workflowRun.pull_requests?.[0]?.number;

            if (pullNumber == null) {
              core.setFailed('No pull request associated with Copilot workflow run.');
              return;
            }

            const headSha = workflowRun.head_sha;
            core.info(`Copilot workflow completed for PR #${pullNumber} (${headSha.slice(0, 7)})`);

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pullRequest.draft) {
              core.info('Draft PR. Skipping.');
              core.setOutput('count', '0');
              return;
            }

            if (pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Fork PR. Skipping.');
              core.setOutput('count', '0');
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const copilotReview = reviews
              .filter(
                (review) =>
                  COPILOT_LOGINS.has(review.user.login) &&
                  review.commit_id === headSha &&
                  review.submitted_at != null,
              )
              .sort(
                (left, right) =>
                  new Date(right.submitted_at).getTime() -
                  new Date(left.submitted_at).getTime(),
              )[0];

            if (copilotReview == null) {
              core.warning(
                `No Copilot review found for ${headSha.slice(0, 7)} on PR #${pullNumber}`,
              );
              core.setOutput('count', '0');
              return;
            }

            const reviewId = copilotReview.id;
            let page = 1;
            let newCommentCount = 0;

            while (true) {
              const { data: comments } = await github.rest.pulls.listCommentsForReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                review_id: reviewId,
                per_page: 100,
                page,
              });

              newCommentCount += comments.length;

              if (comments.length < 100) {
                break;
              }
              page += 1;
            }

            core.info(
              `Copilot review ${reviewId} on PR #${pullNumber}: ${newCommentCount} new inline comment(s)`,
            );

            core.setOutput('count', String(newCommentCount));
            core.setOutput('review_id', String(reviewId));
            core.setOutput('review_url', copilotReview.html_url);
            core.setOutput('pull_request_number', String(pullNumber));
            core.setOutput('head_sha', headSha);

      - name: Skip webhook (no new inline comments)
        if: steps.review-comments.outputs.count == '0' || steps.review-comments.outputs.count == ''
        run: |
          echo "No new inline comments for Copilot review on PR #${{ steps.review-comments.outputs.pull_request_number }}. Skipping."

      - name: Write webhook payload artifact
        if: steps.review-comments.outputs.count != '0' && steps.review-comments.outputs.count != ''
        run: |
          mkdir -p /tmp/cursor-webhook
          jq -n \
            --arg event "copilot_review_submitted" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson pull_request_number "${{ steps.review-comments.outputs.pull_request_number }}" \
            --argjson review_id "${{ steps.review-comments.outputs.review_id }}" \
            --arg head_sha "${{ steps.review-comments.outputs.head_sha }}" \
            --arg review_url "${{ steps.review-comments.outputs.review_url }}" \
            --argjson new_comment_count "${{ steps.review-comments.outputs.count }}" \
            '{
              event: $event,
              repository: $repository,
              pull_request_number: $pull_request_number,
              review_id: $review_id,
              head_sha: $head_sha,
              review_url: $review_url,
              new_comment_count: $new_comment_count
            }' > /tmp/cursor-webhook/payload.json
          cat /tmp/cursor-webhook/payload.json

      - name: Upload webhook payload artifact
        if: steps.review-comments.outputs.count != '0' && steps.review-comments.outputs.count != ''
        uses: actions/upload-artifact@v4
        with:
          name: cursor-webhook-payload
          path: /tmp/cursor-webhook/payload.json
          retention-days: 1
          if-no-files-found: error
