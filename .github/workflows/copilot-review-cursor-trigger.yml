# Copilot レビュー submit 後、Webhook 起動用の payload を artifact に書き出す（secrets 不使用）。
#
# secrets を使う Webhook POST は copilot-cursor-webhook-dispatch.yml（workflow_run）に委譲し、
# Copilot bot 起点でも Approve Run を避ける。
#
# 新規インラインコメントが 0 件の Copilot review では artifact を作らない。

name: Copilot review → Cursor gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: copilot-cursor-gate-${{ github.event.pull_request.number }}-${{ github.event.review.id }}
  cancel-in-progress: false

jobs:
  prepare-cursor-webhook:
    name: Prepare Cursor Automation payload
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.type == 'Bot' &&
      (
        github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' ||
        github.event.review.user.login == 'copilot-pull-request-reviewer' ||
        github.event.review.user.login == 'Copilot'
      ) &&
      github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Count new inline comments on this Copilot review
        id: review-comments
        uses: actions/github-script@v7
        with:
          script: |
            const reviewId = context.payload.review.id;
            const pullNumber = context.payload.pull_request.number;
            let page = 1;
            let newCommentCount = 0;

            while (true) {
              const { data: comments } = await github.rest.pulls.listCommentsForReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                review_id: reviewId,
                per_page: 100,
                page,
              });

              newCommentCount += comments.length;

              if (comments.length < 100) {
                break;
              }
              page += 1;
            }

            core.info(
              `Copilot review ${reviewId} on PR #${pullNumber}: ${newCommentCount} new inline comment(s)`,
            );
            core.setOutput('count', String(newCommentCount));

      - name: Skip webhook (no new inline comments)
        if: steps.review-comments.outputs.count == '0'
        run: |
          echo "No new inline comments on Copilot review ${{ github.event.review.id }}. Skipping Cursor Automation webhook."

      - name: Write webhook payload artifact
        if: steps.review-comments.outputs.count != '0'
        run: |
          mkdir -p /tmp/cursor-webhook
          jq -n \
            --arg event "copilot_review_submitted" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson pull_request_number "${{ github.event.pull_request.number }}" \
            --argjson review_id "${{ github.event.review.id }}" \
            --arg head_sha "${{ github.event.review.commit_id }}" \
            --arg review_url "${{ github.event.review.html_url }}" \
            --argjson new_comment_count "${{ steps.review-comments.outputs.count }}" \
            '{
              event: $event,
              repository: $repository,
              pull_request_number: $pull_request_number,
              review_id: $review_id,
              head_sha: $head_sha,
              review_url: $review_url,
              new_comment_count: $new_comment_count
            }' > /tmp/cursor-webhook/payload.json
          cat /tmp/cursor-webhook/payload.json

      - name: Upload webhook payload artifact
        if: steps.review-comments.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cursor-webhook-payload
          path: /tmp/cursor-webhook/payload.json
          retention-days: 1
          if-no-files-found: error
